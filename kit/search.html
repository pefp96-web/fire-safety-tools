['home','건물 정보·백업·사진 설정','index.html?home=1','건물 정보 입력, 백업·기기 옮기기, 사진 도장','건물정보 백업 복원 기기옮기기 휴대폰교체 사진설정 사진도장 수첩홈 설정','기능','자료'],
['install','앱 설치 안내','../install.html','안드로이드·아이폰','앱설치 설치 홈화면 추가','기능','자료'],
['feedback','의견 보내기','../feedback.html','후기·오류 신고·기능 요청','의견 건의 오류 신고 버그 요청 후기','기능','자료'],
['dash','도구 모음(웹 첫 화면)','../','계산기·도면 검토 등 전체 도구','도구모음 대시보드 웹 처음화면','기능','자료']
];
var BY={};T.forEach(function(t){BY[t[0]]=t;});
var CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
var JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
var JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function nz(s){return String(s||'').toLowerCase().replace(/[\s·\-_,.()\[\]~/%?!]+/g,'');}
function cho(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i)-44032;o+=(c>=0&&c<11172)?CHO[Math.floor(c/588)]:s[i];}return o;}
function jamo(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i)-44032;if(c>=0&&c<11172){o+=CHO[Math.floor(c/588)]+JUNG[Math.floor(c%588/28)]+JONG[c%28];}else o+=s[i];}return o;}
function isCho(s){return /^[ㄱ-ㅎ]+$/.test(s);}
function bigr(s){var a={};for(var i=0;i<s.length-1;i++){var k=s.substr(i,2);a[k]=(a[k]||0)+1;}return a;}
function dice(a,b){if(a.length<2||b.length<2)return a===b?1:0;var A=bigr(a),B=bigr(b),n=0,ta=a.length-1,tb=b.length-1;for(var k in A)if(B[k])n+=Math.min(A[k],B[k]);return 2*n/(ta+tb);}
// 미리 계산
T.forEach(function(t){
 var words=(t[1]+' '+t[4]).split(/[\s·()]+/).map(nz).filter(function(w){return w.length>0;});
 t.hay=nz(t[1]+' '+t[4]+' '+t[3]);t.nm=nz(t[1]);t.words=words;
 t.jw=words.map(jamo);t.ch=words.map(cho);t.chn=cho(t.nm);
});
// 사용 기록 (이 기기에만)
function use(){try{return JSON.parse(localStorage.getItem('fst-use')||'{}');}catch(e){return {};}}
function urlKey(u){return String(u||'').replace(/^.*\/kit\//,'').replace(/^\.\.\//,'../');}
function bump(id){var u=use(),x=u[id]||{n:0,t:0};x.n++;x.t=Date.now();u[id]=x;try{localStorage.setItem('fst-use',JSON.stringify(u));}catch(e){}}
// 다른 화면 방문 기록(common.js 가 남김)을 합침
(function(){try{var v=JSON.parse(localStorage.getItem('fst-visit')||'{}'),u=use(),ch=0;T.forEach(function(t){var k=urlKey(t[2]);if(v[k]&&(!u[t[0]]||v[k].t>u[t[0]].t)){u[t[0]]={n:Math.max((u[t[0]]||{}).n||0,v[k].n||0),t:v[k].t};ch=1;}});if(ch)localStorage.setItem('fst-use',JSON.stringify(u));}catch(e){}})();

function score(t,q,toks){
 var s=0,hit=0;
 if(t.nm.indexOf(q)===0)s+=130;else if(t.nm.indexOf(q)>-1)s+=110;else if(t.hay.indexOf(q)>-1)s+=90;
 toks.forEach(function(k){
  var best=0;
  if(t.nm.indexOf(k)>-1)best=40+Math.min(k.length,4)*4;
  else if(t.hay.indexOf(k)>-1)best=30+Math.min(k.length,4)*4;
  else if(isCho(k)&&k.length>=2){if(t.chn.indexOf(k)===0)best=50;else if(t.chn.indexOf(k)>-1)best=42;else if(t.ch.some(function(w){return w.indexOf(k)===0;}))best=35;}
  else if(k.length>=2){var jk=jamo(k),m=0;t.jw.forEach(function(w){var d=dice(jk,w);if(w.indexOf(jk)>-1)d=Math.max(d,.9);if(d>m)m=d;});if(m>=.55)best=m*30;}
  if(best>0)hit++;s+=best;
 });
 if(toks.length>1&&hit<Math.ceil(toks.length/2))return 0;
 if(s>0){s+=hit*10;var u=use()[t[0]];if(u)s+=Math.min(u.n,6);}
 return s;
}
var QNA=null,qnaP=null;
function loadQna(){if(qnaP)return qnaP;qnaP=fetch('qna-data.json').then(function(r){return r.json();}).then(function(d){QNA=d.map(function(x){x.h=nz((x.t||'')+' '+(x.q||'')+' '+(x.g||[]).join(' ')+' '+(x.n||[]).join(' ')+' '+(x.l||''));return x;});return QNA;}).catch(function(){QNA=[];return QNA;});return qnaP;}
var SYN={'오작동':['비화재보','오동작'],'오동작':['비화재보','오작동'],'오보':['비화재보'],'오경보':['비화재보'],'몇개':['수량'],'갯수':['수량'],'개수':['수량'],'마감':['기한'],'언제까지':['기한']};
function qnaFind(q,toks){
 if(!QNA)return [];
 var ks=[];toks.forEach(function(k){ks.push([k].concat(SYN[k]||[]));});
 var r=[];QNA.forEach(function(x){var s=0,hit=0;if(x.h.indexOf(q)>-1)s+=50;ks.forEach(function(g){var ok=g.some(function(k){return k.length>=2&&x.h.indexOf(k)>-1;});if(ok){hit++;s+=10;}});if(hit===ks.length||s>=50){if(nz(x.t).indexOf(q)>-1||nz(x.q).indexOf(toks[0])>-1)s+=5;r.push([s,x]);}});
 r.sort(function(a,b){return b[0]-a[0]||b[1].y-a[1].y;});return r.slice(0,4).map(function(p){return p[1];});
}
function E(s){return KIT.esc(s);}
function hl(name,toks){var h=E(name);toks.forEach(function(k){if(k.length<1||isCho(k))return;var i=h.indexOf(k);if(i>-1)h=h.slice(0,i)+'<mark>'+k+'</mark>'+h.slice(i+k.length);});return h;}
var TAGC={'할 일':'t-do','기록':'','기능':'','법령':'t-law','질의회신':'t-qna'};
function row(t,toks){return '<li><a href="'+t[2]+'" data-id="'+t[0]+'"><b><span class="tag '+(TAGC[t[5]]||'')+'">'+t[5]+'</span>'+hl(t[1],toks)+'</b><small>'+E(t[3])+'</small></a></li>';}
var inp=document.getElementById('q'),out=document.getElementById('out'),home=document.getElementById('home'),clr=document.getElementById('clr');
function search(raw){
 var q=nz(raw);
 clr.hidden=!raw;
 if(!q){out.hidden=true;home.hidden=false;return;}
 home.hidden=true;out.hidden=false;
 var toks=raw.trim().toLowerCase().split(/\s+/).map(nz).filter(Boolean);
 var r=T.map(function(t){return [score(t,q,toks),t];}).filter(function(p){return p[0]>0;}).sort(function(a,b){return b[0]-a[0];}).slice(0,8).map(function(p){return p[1];});
 var h='';
 if(r.length)h+='<ul class="res" id="r-main">'+r.map(function(t){return row(t,toks);}).join('')+'</ul>';
 var qa=qnaFind(q,toks);
 if(qa.length)h+='<div class="ttl">관련 질의회신</div><ul class="res">'+qa.map(function(x){return '<li><a href="qna.html?q='+encodeURIComponent(raw.trim())+'#'+x.i+'"><b><span class="tag t-qna">질의회신</span>'+E(x.t||'')+'</b><small>'+E((x.q||'').slice(0,80))+'</small></a></li>';}).join('')+'<li><a href="qna.html?q='+encodeURIComponent(raw.trim())+'"><b>질의회신 657건에서 "'+E(raw.trim())+'" 전부 보기 ›</b></a></li></ul>';
 if(!r.length&&!qa.length){
  var sug=T.map(function(t){var j=jamo(q),m=0;t.jw.forEach(function(w){var d=dice(j,w);if(d>m)m=d;});return [m,t];}).sort(function(a,b){return b[0]-a[0];}).slice(0,3).map(function(p){return p[1];});
  h='<div class="empty">"'+E(raw)+'"에 맞는 기능이 없습니다. 이것을 찾으셨나요?</div><ul class="res" style="margin-top:8px">'+sug.map(function(t){return row(t,[]);}).join('')+'<li><a href="qna.html?q='+encodeURIComponent(raw.trim())+'"><b><span class="tag t-qna">질의회신</span>질의회신에서 찾아보기 ›</b></a></li><li><a href="law.html"><b><span class="tag t-law">법령</span>법령·점검항목에서 찾아보기 ›</b></a></li></ul>';
 }
 out.innerHTML=h;
 if(!QNA)loadQna().then(function(){if(inp.value===raw)search(raw);});
}
inp.addEventListener('input',function(){search(inp.value);});
inp.addEventListener('keydown',function(e){if(e.key==='Enter'){var a=out.querySelector('a');if(a){e.preventDefault();a.click();}}});
clr.onclick=function(){inp.value='';search('');inp.focus();};

function card(t){return '<a href="'+t[2]+'" data-id="'+t[0]+'"><b>'+E(t[1])+'</b><span>'+E(t[3])+'</span></a>';}
function paintHome(){
 var u=use(),ids=Object.keys(u).filter(function(k){return BY[k];});
 var rec=ids.slice().sort(function(a,b){return u[b].t-u[a].t;}).slice(0,3);
 document.getElementById('recent').innerHTML=rec.length?rec.map(function(id){return '<a class="chip" href="'+BY[id][2]+'" data-id="'+id+'">'+E(BY[id][1])+'</a>';}).join(''):'<span class="hint" style="padding:4px 2px">아직 없습니다. 위에 할 일을 적어 보세요(예: 보고 기한, 소화기 몇 개).</span>';
 var fav=ids.filter(function(k){return u[k].n>=2;}).sort(function(a,b){return u[b].n-u[a].n;});
 ['inspect','defects','record','calendar'].forEach(function(d){if(fav.indexOf(d)<0)fav.push(d);});
 document.getElementById('fav').innerHTML=fav.slice(0,4).map(function(id){return card(BY[id]);}).join('');
}

var tabs=[].slice.call(document.querySelectorAll('.tabs button'));
function show(p){tabs.forEach(function(b){b.setAttribute('aria-selected',b.dataset.p===p?'true':'false');});['s','today','rec','more'].forEach(function(k){document.getElementById('p-'+k).hidden=k!==p;});
 if(p==='today')paintToday();if(p==='rec')paintRec();if(p==='more')paintMore();if(p==='s'){paintHome();}

function paintToday(){KIT.glance(document.getElementById('gl'),'').catch(function(){});KIT.audit('all').then(function(A){var a=A.filter(function(x){return x.lv==='err';}).concat(A.filter(function(x){return x.lv!=='err';})).slice(0,6);document.getElementById('aud').innerHTML=a.length?a.map(function(x){return '<li><a href="'+x.link+'"><b><span class="tag '+(x.lv==='err'?'t-do':'')+'">'+(x.lv==='err'?'꼭':'확인')+'</span>'+E(x.where)+'</b><small>'+E(x.msg)+'</small></a></li>';}).join('')+'<li><a href="check.html"><b>누락 검사 전체 보기 ›</b></a></li>':'<li><a href="check.html"><b>빠진 것 없음</b><small>누락 검사 열기</small></a></li>';}).catch(function(){});}
function paintRec(){Promise.all([KIT.all('defects'),KIT.all('records'),KIT.all('logs')]).then(function(r){var op=r[0].filter(function(x){return !x.fix;}).length;
 var L=[['defects','지적사항 적기','미조치 '+op+'건'],['inspect','자체점검 점검표',''],['record','업무수행기록표','지금까지 '+r[1].length+'건'],['logsfire','비화재보·화재 기록',''],['logsouter','외관점검표(월 1회)',''],['logst28','훈련·교육 결과 기록부',''],['household','아파트 세대 점검표',''],['logs','기록부 전체(10종)','지금까지 '+r[2].length+'건']];
 document.getElementById('recs').innerHTML=L.map(function(x){return '<a href="'+BY[x[0]][2]+'" data-id="'+x[0]+'">'+x[1]+'<span>'+x[2]+' ›</span></a>';}).join('');}).catch(function(){});}
function paintMore(){var G={};T.forEach(function(t){(G[t[6]]=G[t[6]]||[]).push(t);});
 document.getElementById('all').innerHTML=['시작 전','점검','계산','기록','매달·상시','출력·공유','자료'].filter(function(g){return G[g];}).map(function(g){return '<div class="grp"><h3>'+g+'</h3><ul class="res">'+G[g].map(function(t){return row(t,[]);}).join('')+'</ul></div>';}).join('')+'<div class="grp"><h3>바깥</h3><ul class="res"><li><a href="https://pefp96-web.github.io/sobang-docs/" target="_blank" rel="noopener"><b>소방계획서 자동 생성기</b><small>다른 사이트로 열림</small></a></li></ul></div>';}
var h0=(location.hash||'').slice(1);
if(['today','rec','more'].indexOf(h0)>-1)show(h0);
else{var q0=new URLSearchParams(location.search).get('q');if(q0){inp.value=q0;search(q0);}setTimeout(function(){inp.focus();},60);}
window.addEventListener('pageshow',function(e){if(e.persisted)paintHome();});
setTimeout(loadQna,1200);
window.SEARCH={run:search,T:T};
})();
